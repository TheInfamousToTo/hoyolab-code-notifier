name: Security and regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py security.py tests/
      - name: Execute regression tests
        run: python -m unittest discover -s tests -v
      - name: Scan installed Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Scan Python sources
        run: |
          pip install bandit
          bandit -q -r app.py security.py --skip B110,B311
